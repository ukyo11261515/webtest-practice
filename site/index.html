<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Webテスト練習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%23c62828%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2745%27%20font-size%3D%2738%27%20text-anchor%3D%27middle%27%20fill%3D%27white%27%20font-weight%3D%27700%27%20font-family%3D%27Hiragino%20Sans%2C%20Yu%20Gothic%20UI%2C%20sans-serif%27%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

<section id="lock" class="screen card narrow" hidden>
  <h1>Webテスト練習</h1>
  <p class="muted">パスワードを入れてください。</p>
  <form id="lock-form" autocomplete="off">
    <input id="lock-pw" type="password" inputmode="numeric" autocomplete="off" aria-label="パスワード" required>
    <label class="check"><input id="lock-remember" type="checkbox"> この端末で記憶する</label>
    <button type="submit" class="primary">開く</button>
    <p id="lock-error" class="error" role="alert"></p>
  </form>
</section>

<section id="home" class="screen" hidden>
  <header class="top">
    <h1 id="home-title">SPI 言語</h1>
    <button id="logout" class="link">ロックする</button>
  </header>

  <div class="card">
    <div class="card-head">
      <h2>問題タイプ</h2>
      <div class="row-buttons tight">
        <button id="types-all" class="small">すべて</button>
        <button id="types-none" class="small">外す</button>
      </div>
    </div>
    <div id="type-chips" class="type-chips"></div>
    <details class="sub-settings">
      <summary>制限時間を変える</summary>
      <div id="type-times" class="type-times"></div>
      <button id="times-reset" class="small">既定に戻す</button>
    </details>
  </div>

  <div class="card">
    <h2>問題数</h2>
    <div class="seg" id="count-seg">
      <button data-count="10">10</button><button data-count="20">20</button><button data-count="30">30</button><button data-count="50">50</button><button data-count="0">すべて</button>
    </div>
    <label class="inline-num">数を入れる <input id="count-input" type="number" min="1" max="999" inputmode="numeric"> 問</label>
  </div>

  <div class="card">
    <h2>並び順とどこから解くか</h2>
    <div class="seg" id="order-seg">
      <button data-order="source">問題集の順</button><button data-order="random">ランダム</button>
    </div>
    <div id="start-block">
      <div class="seg" id="start-seg">
        <button data-start="first">最初から</button><button data-start="resume">前回の続きから</button><button data-start="number">何問目から</button>
      </div>
      <label class="inline-num" id="start-number-wrap"><input id="start-number" type="number" min="1" inputmode="numeric"> 問目から</label>
    </div>
  </div>

  <div class="card">
    <h2>出題のしかた</h2>
    <div class="field">
      <span class="field-label">出題する問題</span>
      <div class="seg" id="filter-seg">
        <button data-filter="all">すべて</button><button data-filter="wrong">間違えた問題</button><button data-filter="new">未回答の問題</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">答え合わせ</span>
      <div class="seg" id="mode-seg">
        <button data-mode="exam">本番（最後にまとめて）</button><button data-mode="practice">練習（1問ごと）</button>
      </div>
    </div>
    <label class="check"><input id="opt-auto" type="checkbox"> 時間切れで次の問題へ進む（本番と同じ）</label>
    <label class="check"><input id="opt-sound" type="checkbox"> 残り5秒から音を鳴らす</label>
  </div>

  <div class="start-bar sticky">
    <div id="start-info" class="start-info"></div>
    <button id="start" class="primary big">はじめる</button>
  </div>
</section>

<section id="quiz" class="screen" hidden>
  <div class="quiz-top">
    <span id="q-progress"></span>
    <button id="quit" class="link">やめて結果を見る</button>
  </div>

  <div class="spi">
    <div class="spi-instr" id="q-instr"></div>
    <div class="spi-status">
      <svg id="donut" class="donut" viewBox="0 0 100 100" aria-label="時間と回答状況">
        <circle cx="50" cy="50" r="40" class="ring-track-outer"/>
        <circle cx="50" cy="50" r="40" class="ring-outer" id="ring-time" pathLength="100"/>
        <circle cx="50" cy="50" r="27" class="ring-track-inner"/>
        <circle cx="50" cy="50" r="27" class="ring-inner" id="ring-answered" pathLength="100"/>
        <circle cx="50" cy="50" r="19" class="ring-hole"/>
      </svg>
      <div class="donut-labels"><span>時間</span><span>回答状況</span></div>
    </div>

    <div class="spi-left">
      <div id="q-group-badge" class="group-badge" hidden></div>
      <div id="q-passage" class="spi-passage"></div>
      <div id="q-sub" class="spi-sub"></div>
    </div>
    <div class="spi-right">
      <div class="answer-box">
        <div id="q-prompt" class="spi-prompt"></div>
        <div id="q-body"></div>
      </div>
      <div id="q-tabs" class="tabs" hidden></div>
    </div>

    <div class="spi-timer">
      <span class="timer-label">回答時間</span>
      <div class="timer-track">
        <div class="timer-marks"><i style="left:50%"></i><i style="left:70%"></i><i style="left:90%"></i></div>
        <div id="timer-cells" class="timer-cells"></div>
      </div>
      <span id="timer-sec" class="timer-sec"></span>
    </div>
    <div class="spi-next">
      <button id="q-submit" class="next-btn">次へ</button>
    </div>
  </div>

  <div id="q-feedback" class="card feedback" hidden></div>
</section>

<section id="result" class="screen" hidden>
  <header class="top"><h1>結果</h1></header>
  <div class="card summary">
    <div id="r-score" class="score-row"></div>
    <div id="r-types" class="type-results"></div>
  </div>
  <div class="card review-head">
    <h2>答え合わせと解説</h2>
    <div class="seg" id="r-filter">
      <button data-f="all">すべて</button><button data-f="ng">不正解だけ</button><button data-f="timeout">時間切れだけ</button>
    </div>
  </div>
  <div id="r-list" class="review-list"></div>
  <div class="start-bar sticky">
    <button id="r-retry-wrong">間違えた問題を解き直す</button>
    <button id="r-home" class="primary big">最初の画面へ</button>
  </div>
</section>

<p id="loading" class="muted center">読み込み中…</p>
</main>
<script src="app.js"></script>
</body>
</html>
